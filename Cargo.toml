[package]
name = "ibuki"
version = "0.1.0"
edition = "2024"
description = "A lightweight CLI weather tool"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
owo-colors = "4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
mockito = "1"
predicates = "3"
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
