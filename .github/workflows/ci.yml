name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'
      - 'LICENSE'

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Test / Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform's result; don't let the first failure mask the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Formatting and lints are platform-independent; one run is enough.
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check

      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # `stat -c%s` is GNU-only and the binary is `ibuki.exe` on Windows, so the
      # size budget (NFR-002) is enforced on Linux only.
      - name: Release build size
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo build --release
          size=$(stat -c%s target/release/ibuki)
          echo "Binary size: $size bytes"
          test "$size" -lt 5242880
